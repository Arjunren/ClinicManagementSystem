services:
  db:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: clinic, POSTGRES_USER: clinic, POSTGRES_PASSWORD: clinic-local }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"], interval: 5s, timeout: 5s, retries: 15 }
    volumes: [clinic_data:/var/lib/postgresql/data]
  api:
    build: .
    environment: { DJANGO_SECRET_KEY: local-development-secret-key-change-before-production-123456789, DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1", DB_ENGINE: postgresql, DB_NAME: clinic, DB_USER: clinic, DB_PASSWORD: clinic-local, DB_HOST: db, DB_PORT: 5432 }
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { clinic_data: {} }
